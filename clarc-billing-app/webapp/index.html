<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Billing</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <script>
        window["sap-ui-config"] = window["sap-ui-config"] || {};
        window["sap-ui-config"].flexibilityServices =
            window.location.hostname.includes("applicationstudio.cloud.sap")
                ? [{ connector: "LocalStorageConnector" }]
                : [{ connector: "BtpServiceConnector", url: "./keyuser" }];
    </script>
    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "clarc.billing.clarcbillingapp": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-preload="async"
        data-sap-ui-frame-options="trusted"
    >
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="clarc.billing.clarcbillingapp"
        data-id="container"
        data-settings='{"id" : "clarc.billing.clarcbillingapp"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
